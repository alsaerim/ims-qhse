<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IMS QHSE — Super Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Tajawal',sans-serif;background:#f1f5f9;color:#1e293b;direction:rtl;font-size:14px;}
    .sidebar{width:240px;background:white;border-left:1px solid #e2e8f0;height:100vh;position:fixed;right:0;top:0;z-index:50;display:flex;flex-direction:column;box-shadow:2px 0 8px rgba(0,0,0,.06);}
    .main{margin-right:240px;min-height:100vh;}
    .nav-section{font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:6px 16px;margin-top:12px;}
    .nav-item{padding:9px 16px;border-radius:8px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:10px;color:#64748b;margin:1px 8px;font-size:13px;font-weight:500;}
    .nav-item:hover{background:#f1f5f9;color:#1e293b;}
    .nav-item.active{background:#eff6ff;color:#1e40af;font-weight:700;border-right:3px solid #1e40af;}
    .topbar{background:white;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.04);}
    .card{background:white;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.04);}
    .stat-card{background:white;border-radius:12px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
    .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;}
    .badge-green{background:#dcfce7;color:#166534;}
    .badge-yellow{background:#fef9c3;color:#854d0e;}
    .badge-red{background:#fee2e2;color:#991b1b;}
    .badge-blue{background:#dbeafe;color:#1e40af;}
    .badge-gray{background:#f1f5f9;color:#475569;}
    .badge-purple{background:#ede9fe;color:#5b21b6;}
    .badge-teal{background:#ccfbf1;color:#0f766e;}
    .btn{padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:6px;font-size:13px;border:none;font-family:'Tajawal',sans-serif;}
    .btn-primary{background:#1e40af;color:white;}
    .btn-primary:hover{background:#1e3a8a;}
    .btn-success{background:#059669;color:white;}
    .btn-danger{background:#dc2626;color:white;}
    .btn-outline{background:white;color:#475569;border:1px solid #e2e8f0;}
    .btn-outline:hover{border-color:#1e40af;color:#1e40af;}
    .btn-sm{padding:5px 12px;font-size:12px;border-radius:7px;}
    .form-input{width:100%;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;background:white;color:#1e293b;font-size:13px;outline:none;font-family:'Tajawal',sans-serif;transition:border-color .18s;}
    .form-input:focus{border-color:#1e40af;box-shadow:0 0 0 3px rgba(30,64,175,.08);}
    .tbl{width:100%;border-collapse:collapse;font-size:13px;}
    .tbl thead tr{background:#f8fafc;border-bottom:2px solid #e2e8f0;}
    .tbl th{padding:10px 14px;text-align:right;font-weight:700;color:#475569;white-space:nowrap;}
    .tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;}
    .tbl tbody tr:hover{background:#fafbff;}
    .tbl tbody tr:last-child td{border-bottom:none;}
    .toggle{position:relative;width:38px;height:20px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle-slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:20px;transition:.25s;}
    .toggle-slider:before{position:absolute;content:"";height:14px;width:14px;right:3px;bottom:3px;background:white;border-radius:50%;transition:.25s;}
    .toggle input:checked+.toggle-slider{background:#1e40af;}
    .toggle input:checked+.toggle-slider:before{transform:translateX(-18px);}
    .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
    .modal.open{display:flex;}
    .modal-box{background:white;border-radius:16px;border:1px solid #e2e8f0;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeUp .22s ease;}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
  </style>
</head>
<body>

<aside class="sidebar">
  <div style="padding:16px;border-bottom:1px solid #f1f5f9;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fas fa-shield-alt" style="color:white;font-size:14px;"></i>
      </div>
      <div>
        <div style="font-weight:800;font-size:14px;color:#1e293b;">IMS QHSE</div>
        <div style="font-size:10px;font-weight:700;color:#dc2626;letter-spacing:.5px;">SUPER ADMIN</div>
      </div>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:8px 0;">
    <div class="nav-section">الرئيسية</div>
    <div class="nav-item active" onclick="navigate('dashboard')"><i class="fas fa-tachometer-alt" style="width:16px;text-align:center;font-size:13px;"></i>لوحة التحكم</div>
    <div class="nav-item" onclick="navigate('analytics')"><i class="fas fa-chart-line" style="width:16px;text-align:center;font-size:13px;"></i>التحليلات المالية</div>
    <div class="nav-section">الاشتراكات</div>
    <div class="nav-item" onclick="navigate('tenants')"><i class="fas fa-building" style="width:16px;text-align:center;font-size:13px;"></i>المستأجرون</div>
    <div class="nav-item" onclick="navigate('plans')"><i class="fas fa-layer-group" style="width:16px;text-align:center;font-size:13px;"></i>إدارة الباقات</div>
    <div class="nav-item" onclick="navigate('invoices')"><i class="fas fa-file-invoice-dollar" style="width:16px;text-align:center;font-size:13px;"></i>الفواتير</div>
    <div class="nav-section">النظام</div>
    <div class="nav-item" onclick="navigate('settings')"><i class="fas fa-cog" style="width:16px;text-align:center;font-size:13px;"></i>الإعدادات</div>
    <div class="nav-item" onclick="logout()" style="color:#dc2626;"><i class="fas fa-sign-out-alt" style="width:16px;text-align:center;font-size:13px;"></i>تسجيل الخروج</div>
  </div>
  <div style="padding:12px 16px;border-top:1px solid #f1f5f9;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:50%;background:#1e40af;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:800;flex-shrink:0;">SA</div>
      <div><div style="font-size:13px;font-weight:700;color:#1e293b;">Super Admin</div><div style="font-size:11px;color:#94a3b8;">admin@ims-qhse.com</div></div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div style="font-size:17px;font-weight:800;color:#1e293b;" id="page-title">لوحة التحكم</div>
      <div style="font-size:12px;color:#94a3b8;" id="page-subtitle">نظرة شاملة على النظام والاشتراكات</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="font-size:12px;color:#94a3b8;" id="current-time"></div>
      <div style="display:flex;align-items:center;gap:5px;background:#dcfce7;padding:4px 12px;border-radius:999px;">
        <div style="width:6px;height:6px;border-radius:50%;background:#059669;"></div>
        <span style="font-size:11px;font-weight:700;color:#166534;">متصل</span>
      </div>
    </div>
  </div>
  <div style="padding:24px;" id="content">
    <div style="display:flex;justify-content:center;align-items:center;height:60vh;">
      <i class="fas fa-spinner fa-spin" style="font-size:28px;color:#1e40af;"></i>
    </div>
  </div>
</main>

<!-- Modals -->
<div class="modal" id="modal-tenant">
  <div class="modal-box" style="max-width:680px;margin:16px;">
    <div style="padding:18px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:16px;font-weight:800;" id="tenant-modal-title">تفاصيل المستأجر</div>
      <button onclick="closeModal('modal-tenant')" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:18px;"><i class="fas fa-times"></i></button>
    </div>
    <div style="padding:20px;" id="tenant-modal-body"></div>
  </div>
</div>

<div class="modal" id="modal-plan">
  <div class="modal-box" style="max-width:520px;margin:16px;">
    <div style="padding:18px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:16px;font-weight:800;" id="plan-modal-title">الباقة</div>
      <button onclick="closeModal('modal-plan')" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:18px;"><i class="fas fa-times"></i></button>
    </div>
    <div style="padding:20px;" id="plan-modal-body"></div>
  </div>
</div>

<div class="modal" id="modal-assign">
  <div class="modal-box" style="max-width:400px;margin:16px;">
    <div style="padding:18px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:16px;font-weight:800;">تعيين باقة</div>
      <button onclick="closeModal('modal-assign')" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:18px;"><i class="fas fa-times"></i></button>
    </div>
    <div style="padding:20px;">
      <input type="hidden" id="assign-tenant-id"/>
      <div style="margin-bottom:14px;">
        <label style="font-size:12px;color:#64748b;font-weight:600;display:block;margin-bottom:5px;">الباقة</label>
        <select class="form-input" id="assign-plan-id"></select>
      </div>
      <div style="margin-bottom:20px;">
        <label style="font-size:12px;color:#64748b;font-weight:600;display:block;margin-bottom:5px;">دورة الفوترة</label>
        <select class="form-input" id="assign-billing">
          <option value="monthly">شهري</option>
          <option value="yearly">سنوي (خصم 16%)</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="submitAssignPlan()" class="btn btn-primary" style="flex:1;justify-content:center;"><i class="fas fa-check ml-1"></i>تعيين</button>
        <button onclick="closeModal('modal-assign')" class="btn btn-outline">إلغاء</button>
      </div>
    </div>
  </div>
</div>

<script>
const API='https://ims-qhse-backend-production.up.railway.app/api/v1';
let _plans=[],_charts={};

function getToken(){return localStorage.getItem('ims_token')||localStorage.getItem('sa_token');}
function logout(){localStorage.removeItem('ims_token');showLoginScreen();}

async function apiFetch(url,method='GET',body=null){
  const token=getToken();
  const opts={method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}};
  if(body)opts.body=JSON.stringify(body);
  try{
    const res=await fetch(API+url,opts);
    if(res.status===401){showLoginScreen();return null;}
    const json=await res.json();
    return json.data!==undefined?json.data:json;
  }catch(e){return null;}
}

function navigate(page){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>{if(el.getAttribute('onclick')?.includes("'"+page+"'"))el.classList.add('active');});
  const T={dashboard:['لوحة التحكم','نظرة شاملة على النظام والاشتراكات'],analytics:['التحليلات المالية','الإيرادات · MRR · ARR'],tenants:['المستأجرون','إدارة جميع المستأجرين'],plans:['إدارة الباقات','تسعير · مميزات · حدود الاستخدام'],invoices:['الفواتير','تتبع المدفوعات'],settings:['الإعدادات','إعدادات النظام']};
  const [t,s]=T[page]||['الصفحة',''];
  document.getElementById('page-title').textContent=t;
  document.getElementById('page-subtitle').textContent=s;
  document.getElementById('content').innerHTML='<div style="display:flex;justify-content:center;align-items:center;height:60vh;"><i class="fas fa-spinner fa-spin" style="font-size:28px;color:#1e40af;"></i></div>';
  ({dashboard:loadDashboard,analytics:loadAnalytics,tenants:loadTenants,plans:loadPlans,invoices:loadInvoices,settings:loadSettings}[page]||loadDashboard)();
}

async function loadDashboard(){
  const stats=await apiFetch('/super-admin/stats')||{};
  const t=stats.tenants||{},r=stats.revenue||{},s=stats.subs||{},plans=stats.plans||[];
  document.getElementById('content').innerHTML=`
  <div class="fade-in" style="display:flex;flex-direction:column;gap:20px;">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
      ${kpi('MRR',fSAR(r.mrr||0),'chart-line','#1e40af','الإيراد الشهري المتكرر','#eff6ff')}
      ${kpi('ARR',fSAR(r.arr||0),'chart-bar','#059669','الإيراد السنوي المتكرر','#f0fdf4')}
      ${kpi('مستأجرون نشطون',t.active||0,'building','#7c3aed','من '+(t.total||0)+' إجمالي','#faf5ff')}
      ${kpi('فواتير معلقة',r.pending_count||0,'clock','#d97706',fSAR(r.pending_amount||0),'#fffbeb')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
      <div class="card" style="padding:18px;">
        <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:14px;display:flex;align-items:center;gap:7px;"><div style="width:26px;height:26px;border-radius:7px;background:#eff6ff;display:flex;align-items:center;justify-content:center;"><i class="fas fa-layer-group" style="color:#1e40af;font-size:11px;"></i></div>توزيع الباقات</div>
        <canvas id="chart-plans" height="180"></canvas>
      </div>
      <div class="card" style="padding:18px;">
        <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:14px;display:flex;align-items:center;gap:7px;"><div style="width:26px;height:26px;border-radius:7px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;"><i class="fas fa-circle-check" style="color:#059669;font-size:11px;"></i></div>حالة الاشتراكات</div>
        ${sRow('نشطة',s.active||0,'#059669')}
        ${sRow('تجريبية',s.trial||0,'#d97706')}
        ${sRow('ملغاة',s.cancelled||0,'#dc2626')}
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;">
          <div style="padding:10px;border-radius:8px;background:#f0fdf4;text-align:center;"><div style="font-size:20px;font-weight:800;color:#059669;">${s.active||0}</div><div style="font-size:10px;color:#94a3b8;">نشطة</div></div>
          <div style="padding:10px;border-radius:8px;background:#fffbeb;text-align:center;"><div style="font-size:20px;font-weight:800;color:#d97706;">${s.trial||0}</div><div style="font-size:10px;color:#94a3b8;">تجريبية</div></div>
          <div style="padding:10px;border-radius:8px;background:#fee2e2;text-align:center;"><div style="font-size:20px;font-weight:800;color:#dc2626;">${s.cancelled||0}</div><div style="font-size:10px;color:#94a3b8;">ملغاة</div></div>
        </div>
      </div>
      <div class="card" style="padding:18px;">
        <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:14px;display:flex;align-items:center;gap:7px;"><div style="width:26px;height:26px;border-radius:7px;background:#fffbeb;display:flex;align-items:center;justify-content:center;"><i class="fas fa-bolt" style="color:#d97706;font-size:11px;"></i></div>إجراءات سريعة</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button onclick="navigate('tenants')" class="btn btn-primary" style="justify-content:flex-start;width:100%;"><i class="fas fa-building"></i>إدارة المستأجرين</button>
          <button onclick="navigate('plans')" class="btn btn-outline" style="justify-content:flex-start;width:100%;"><i class="fas fa-layer-group"></i>تعديل الباقات والأسعار</button>
          <button onclick="navigate('invoices')" class="btn btn-outline" style="justify-content:flex-start;width:100%;"><i class="fas fa-file-invoice-dollar"></i>الفواتير المعلقة</button>
          <button onclick="navigate('analytics')" class="btn btn-outline" style="justify-content:flex-start;width:100%;"><i class="fas fa-chart-line"></i>تقرير الإيرادات</button>
        </div>
      </div>
    </div>
    <div class="card" style="padding:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;"><div style="width:26px;height:26px;border-radius:7px;background:#f8fafc;display:flex;align-items:center;justify-content:center;"><i class="fas fa-users" style="color:#475569;font-size:11px;"></i></div>أحدث المستأجرين</div>
        <button onclick="navigate('tenants')" style="background:none;border:none;cursor:pointer;color:#1e40af;font-size:12px;font-weight:600;font-family:'Tajawal',sans-serif;">عرض الكل ←</button>
      </div>
      <div id="recent-tenants"></div>
    </div>
  </div>`;
  setTimeout(()=>{
    if(plans.length){const ctx=document.getElementById('chart-plans');if(ctx){if(_charts.p)_charts.p.destroy();_charts.p=new Chart(ctx,{type:'doughnut',data:{labels:plans.map(p=>p.name_ar||p.name),datasets:[{data:plans.map(p=>Number(p.subscriber_count||0)),backgroundColor:['#1e40af','#7c3aed','#059669','#d97706'],borderWidth:3,borderColor:'white',hoverOffset:6}]},options:{responsive:true,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:'#475569',boxWidth:10,font:{family:'Tajawal',size:11}}}}}});}}
    loadRecentTenants();
  },100);
}

async function loadRecentTenants(){
  const res=await apiFetch('/super-admin/tenants?limit=5');
  const rows=res?.data||res||[];
  const el=document.getElementById('recent-tenants');if(!el)return;
  if(!rows.length){el.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">لا توجد بيانات</div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr><th>المستأجر</th><th>الباقة</th><th>الحالة</th><th>المستخدمون</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr style="cursor:pointer;" onclick="openTenantModal('${t.id}')"><td><div style="font-weight:600;">${t.name||'—'}</div><div style="font-size:11px;color:#94a3b8;">${t.email||''}</div></td><td>${pBadge(t.plan_key||t.plan_name)}</td><td>${sBadge(t.status)}</td><td>${t.active_users||0}</td><td onclick="event.stopPropagation()"><button onclick="openAssignModal('${t.id}')" class="btn btn-outline btn-sm"><i class="fas fa-exchange-alt"></i></button></td></tr>`).join('')}</tbody></table>`;
}

async function loadAnalytics(){
  const data=await apiFetch('/super-admin/revenue')||{};
  const monthly=data.monthly||[],byPlan=data.byPlan||[];
  document.getElementById('content').innerHTML=`
  <div class="fade-in" style="display:flex;flex-direction:column;gap:16px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card" style="padding:18px;"><div style="font-size:13px;font-weight:700;margin-bottom:14px;">الإيرادات — آخر 12 شهراً</div><canvas id="cr" height="220"></canvas></div>
      <div class="card" style="padding:18px;"><div style="font-size:13px;font-weight:700;margin-bottom:14px;">توزيع الإيرادات حسب الباقة</div><canvas id="cp" height="220"></canvas></div>
    </div>
    <div class="card" style="padding:18px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:14px;">الإيرادات حسب الباقة</div>
      <table class="tbl"><thead><tr><th>الباقة</th><th>المشتركون</th><th>MRR</th></tr></thead><tbody>${byPlan.map(p=>`<tr><td style="font-weight:600;">${p.name_ar||p.name}</td><td>${p.subscribers||0}</td><td style="color:#059669;font-weight:700;">${fSAR(p.mrr||0)}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:20px;">لا توجد بيانات</td></tr>'}</tbody></table>
    </div>
  </div>`;
  setTimeout(()=>{

async function submitAssignPlan(){
  const tid=document.getElementById('assign-tenant-id').value,pid=document.getElementById('assign-plan-id').value,bc=document.getElementById('assign-billing').value;

async function savePlanEdit(pid){
  const r=await apiFetch('/super-admin/plans/'+pid,'PUT',{name_ar:document.getElementById('pf-ar').value,price_monthly:parseFloat(document.getElementById('pf-m').value)||0,price_yearly:parseFloat(document.getElementById('pf-y').value)||0,max_users:parseInt(document.getElementById('pf-u').value)||5,max_projects:parseInt(document.getElementById('pf-pr').value)||2,storage_gb:parseInt(document.getElementById('pf-s').value)||5});
  if(r){closeModal('modal-plan');showToast('✅ تم حفظ التعديلات');loadPlans();}
  else showToast('❌ خطأ','error');

async function createPlan(){
  const name_ar=document.getElementById('pf-ar').value.trim();
  if(!name_ar){showToast('❌ أدخل الاسم العربي','error');return;}
  const nameEn=document.getElementById('pf-name')?.value?.trim()||name_ar.toLowerCase().replace(/\s+/g,'-');
  const r=await apiFetch('/super-admin/plans','POST',{name:nameEn,name_ar,price_monthly:parseFloat(document.getElementById('pf-m').value)||0,price_yearly:parseFloat(document.getElementById('pf-y').value)||0,max_users:parseInt(document.getElementById('pf-u').value)||5,max_projects:parseInt(document.getElementById('pf-pr').value)||2,storage_gb:parseInt(document.getElementById('pf-s').value)||5});
  if(r){closeModal('modal-plan');showToast('✅ تم إنشاء الباقة بنجاح');loadPlans();}
  else showToast('❌ خطأ في الإنشاء — تأكد من تنفيذ SQL Migration','error');
}

async function toggleFeature(planId,feat,enabled){
  await apiFetch('/super-admin/plans/'+planId+'/features','PUT',{feature:feat,enabled});
  const idx=_plans.findIndex(p=>p.id===planId);
  if(idx>=0){const f=tryParse(typeof _plans[idx].features==='string'?_plans[idx].features:JSON.stringify(_plans[idx].features||{}));f[feat]=enabled;_plans[idx].features=f;}
  showToast((enabled?'✅ ':' 🔴 ')+(enabled?'تم تفعيل':'تم تعطيل')+' '+feat);
}

async function payInvoice(id){
  if(!confirm('تأكيد تسجيل الدفع؟'))return;
  const r=await apiFetch('/super-admin/invoices/'+id+'/pay','POST');
  if(r){showToast('✅ تم تسجيل الدفع');loadInvoices();}
  else showToast('❌ خطأ','error');
}

// ── Helpers ─────────────────────────────────────────────────
function fSAR(v){return Number(v||0).toLocaleString('ar-SA')+' ريال';}
function pBadge(n){
  const M={starter:['#dbeafe','#1e40af'],professional:['#ede9fe','#5b21b6'],enterprise:['#dcfce7','#166534'],custom:['#fef9c3','#854d0e']};
  if(!n||n==='—')return `<span class="badge badge-gray">—</span>`;
  const c=M[n]||M[n?.toLowerCase()]||['#f1f5f9','#475569'];
  return `<span class="badge" style="background:${c[0]};color:${c[1]};font-size:11px;">${n}</span>`;
}
function sBadge(s){const M={ACTIVE:['#dcfce7','#166534','نشط'],TRIAL:['#fef9c3','#854d0e','تجريبي'],CANCELLED:['#fee2e2','#991b1b','ملغى'],EXPIRED:['#fee2e2','#991b1b','منتهي']};const c=M[s]||['#f1f5f9','#475569',s||'—'];return `<span class="badge" style="background:${c[0]};color:${c[1]};">${c[2]}</span>`;}
function iBadge(s){const M={paid:['#dcfce7','#166534','مدفوعة'],pending:['#fef9c3','#854d0e','معلقة'],failed:['#fee2e2','#991b1b','فاشلة'],refunded:['#dbeafe','#1e40af','مسترجعة']};const c=M[s]||['#f1f5f9','#475569',s||'—'];return `<span class="badge" style="background:${c[0]};color:${c[1]};">${c[2]}</span>`;}
function kpi(l,v,ic,col,sub,bg){return `<div class="stat-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:4px;">${l}</div><div style="font-size:22px;font-weight:900;color:${col};">${v}</div><div style="font-size:11px;color:#94a3b8;margin-top:3px;">${sub}</div></div><div style="width:40px;height:40px;border-radius:10px;background:${bg};display:flex;align-items:center;justify-content:center;"><i class="fas fa-${ic}" style="color:${col};font-size:15px;"></i></div></div></div>`;}
function sRow(l,c,col){return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8fafc;"><div style="display:flex;align-items:center;gap:7px;"><div style="width:8px;height:8px;border-radius:50%;background:${col};"></div><span style="font-size:13px;color:#475569;">${l}</span></div><span style="font-weight:700;color:${col};">${c}</span></div>`;}
function ib(l,v){return `<div style="background:#f8fafc;border-radius:8px;padding:10px 14px;"><div style="font-size:11px;color:#94a3b8;margin-bottom:3px;">${l}</div><div style="font-size:14px;font-weight:600;">${v}</div></div>`;}
function openModal(id){document.getElementById(id)?.classList.add('open');}
function closeModal(id){document.getElementById(id)?.classList.remove('open');}
function showToast(msg,type='success'){const d=document.createElement('div');d.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:11px 22px;border-radius:10px;background:${type==='error'?'#dc2626':'#059669'};color:white;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);font-family:'Tajawal',sans-serif;`;d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
function updateClock(){const e=document.getElementById('current-time');if(e)e.textContent=new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}
setInterval(updateClock,1000);updateClock();

// ── Login ────────────────────────────────────────────────────
function showLoginScreen(){
  document.querySelector('.sidebar').style.display='none';
  document.querySelector('.main').style.marginRight='0';
  document.getElementById('content').innerHTML=`
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08);">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,#dc2626,#b91c1c);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;"><i class="fas fa-shield-alt" style="color:white;font-size:22px;"></i></div>
        <div style="font-size:20px;font-weight:800;color:#1e293b;">Super Admin</div>
        <div style="font-size:13px;color:#94a3b8;margin-top:4px;">IMS QHSE Control Panel</div>
      </div>
      <div id="le" style="display:none;background:#fee2e2;border:1px solid #fca5a5;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;"></div>
      <div style="margin-bottom:14px;"><label style="font-size:12px;color:#64748b;font-weight:600;display:block;margin-bottom:5px;">البريد الإلكتروني</label><input type="email" id="sa-em" value="admin@ims-qhse.com" class="form-input"/></div>
      <div style="margin-bottom:20px;"><label style="font-size:12px;color:#64748b;font-weight:600;display:block;margin-bottom:5px;">كلمة المرور</label><input type="password" id="sa-pw" class="form-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button onclick="doLogin()" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px;"><i class="fas fa-sign-in-alt ml-2"></i>دخول لوحة التحكم</button>
    </div>
  </div>`;
}

async function doLogin(){
  const em=document.getElementById('sa-em').value.trim(),pw=document.getElementById('sa-pw').value.trim(),err=document.getElementById('le');
  err.style.display='none';
  try{
    const res=await fetch(API.replace('/api/v1','')+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    const json=await res.json();
    const token=json?.data?.access_token||json?.access_token||json?.token;
    if(!token){err.textContent=json?.message||'بيانات الدخول غير صحيحة';err.style.display='block';return;}
    localStorage.setItem('ims_token',token);
    document.querySelector('.sidebar').style.display='flex';
    document.querySelector('.main').style.marginRight='240px';
    navigate('dashboard');
  }catch(e){err.textContent='خطأ في الاتصال';err.style.display='block';}
}

// ── Init ─────────────────────────────────────────────────────
(function(){const t=getToken();if(!t){showLoginScreen();return;}navigate('dashboard');})();
