<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IMS QHSE — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Tajawal', sans-serif; }
    body { background: #0f172a; color: #e2e8f0; }
    .sidebar { width: 220px; background: #0f172a; border-left: 1px solid #1e293b; height: 100vh; position: fixed; right: 0; top: 0; z-index: 50; }
    .main { margin-right: 220px; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    .nav-item { padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; color: #64748b; margin: 2px 8px; font-size: 13px; }
    .nav-item:hover, .nav-item.active { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .nav-item.active { border-right: 3px solid #3b82f6; }
    .badge-green { background: #052e16; color: #4ade80; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-yellow { background: #422006; color: #fbbf24; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-red { background: #450a0a; color: #f87171; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-blue { background: #0c1a40; color: #60a5fa; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-gray { background: #1e293b; color: #94a3b8; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .btn { padding: 8px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: none; }
    .btn-primary { background: #1e40af; color: white; }
    .btn-primary:hover { background: #1e3a8a; }
    .btn-success { background: #065f46; color: #4ade80; }
    .btn-danger  { background: #450a0a; color: #f87171; }
    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-outline:hover { border-color: #3b82f6; color: #60a5fa; }
    .form-input { width: 100%; padding: 8px 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 13px; outline: none; }
    .form-input:focus { border-color: #3b82f6; }
    .table-row:hover { background: #1e293b; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: #1e293b; border-radius: 14px; border: 1px solid #334155; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #334155; border-radius: 22px; transition: .3s; }
    .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; right: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
    .toggle input:checked + .toggle-slider { background: #3b82f6; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(-18px); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn .25s ease; }
    .stat-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; border-radius: 14px; padding: 20px; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar flex flex-col">
  <div class="p-4 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center">
        <i class="fas fa-shield-alt text-white text-sm"></i>
      </div>
      <div>
        <div class="text-white font-bold text-sm">IMS QHSE</div>
        <div class="text-red-400 text-xs font-bold">SUPER ADMIN</div>
      </div>
    </div>
  </div>

  <nav class="p-2 mt-2 flex-1 overflow-y-auto">
    <div class="text-xs text-slate-600 px-3 mb-2 uppercase tracking-wider">الرئيسية</div>
    <div class="nav-item active" onclick="navigate('dashboard')"><i class="fas fa-tachometer-alt w-4"></i>لوحة التحكم</div>
    <div class="nav-item" onclick="navigate('analytics')"><i class="fas fa-chart-line w-4"></i>التحليلات المالية</div>

    <div class="text-xs text-slate-600 px-3 mb-2 mt-4 uppercase tracking-wider">الاشتراكات</div>
    <div class="nav-item" onclick="navigate('tenants')"><i class="fas fa-building w-4"></i>المستأجرون</div>
    <div class="nav-item" onclick="navigate('plans')"><i class="fas fa-layer-group w-4"></i>إدارة الباقات</div>
    <div class="nav-item" onclick="navigate('invoices')"><i class="fas fa-file-invoice-dollar w-4"></i>الفواتير</div>

    <div class="text-xs text-slate-600 px-3 mb-2 mt-4 uppercase tracking-wider">النظام</div>
    <div class="nav-item" onclick="navigate('settings')"><i class="fas fa-cog w-4"></i>الإعدادات</div>
    <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt w-4"></i>تسجيل الخروج</div>
  </nav>

  <div class="p-3 border-t border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white text-xs font-bold">SA</div>
      <div><div class="text-sm text-white font-medium">Super Admin</div><div class="text-xs text-slate-500">admin@ims-qhse.com</div></div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-40" style="background:#0f172a;">
    <div>
      <h1 class="text-lg font-bold text-white" id="page-title">لوحة التحكم</h1>
      <p class="text-xs text-slate-500" id="page-subtitle">نظرة شاملة على النظام والاشتراكات</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-xs text-slate-500" id="current-time"></div>
      <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
      <span class="text-xs text-green-400">متصل</span>
    </div>
  </div>

  <div class="p-6" id="content">
    <div class="flex justify-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i></div>
  </div>
</main>

<!-- Modal: Tenant Detail -->
<div class="modal" id="modal-tenant">
  <div class="modal-content mx-4" style="max-width:700px;">
    <div class="p-5 border-b border-slate-700 flex items-center justify-between">
      <h3 class="text-white font-bold text-lg" id="tenant-modal-title">تفاصيل المستأجر</h3>
      <button onclick="closeModal('modal-tenant')" class="text-slate-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-5" id="tenant-modal-body">...</div>
  </div>
</div>

<!-- Modal: Plan Edit -->
<div class="modal" id="modal-plan">
  <div class="modal-content mx-4" style="max-width:600px;">
    <div class="p-5 border-b border-slate-700 flex items-center justify-between">
      <h3 class="text-white font-bold text-lg" id="plan-modal-title">تعديل الباقة</h3>
      <button onclick="closeModal('modal-plan')" class="text-slate-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-5" id="plan-modal-body">...</div>
  </div>
</div>

<!-- Modal: Assign Plan -->
<div class="modal" id="modal-assign">
  <div class="modal-content mx-4" style="max-width:400px;">
    <div class="p-5 border-b border-slate-700 flex items-center justify-between">
      <h3 class="text-white font-bold">تعيين باقة للمستأجر</h3>
      <button onclick="closeModal('modal-assign')" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <input type="hidden" id="assign-tenant-id"/>
      <div>
        <label class="text-sm text-slate-400 block mb-1">الباقة</label>
        <select class="form-input" id="assign-plan-id"></select>
      </div>
      <div>
        <label class="text-sm text-slate-400 block mb-1">دورة الفوترة</label>
        <select class="form-input" id="assign-billing">
          <option value="monthly">شهري</option>
          <option value="yearly">سنوي (وفّر 16%)</option>
        </select>
      </div>
      <div class="flex gap-3 pt-2">
        <button onclick="submitAssignPlan()" class="btn btn-primary flex-1"><i class="fas fa-check ml-1"></i>تعيين الباقة</button>
        <button onclick="closeModal('modal-assign')" class="btn btn-outline">إلغاء</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────────
const API = 'https://ims-qhse-backend-production.up.railway.app/api/v1';
let currentPage = 'dashboard';
let _plans = [];
let _charts = {};

// ── Auth ────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('ims_token') || localStorage.getItem('sa_token'); }
function logout() { localStorage.removeItem('ims_token'); location.href = '/'; }

async function apiFetch(url, method='GET', body=null) {
  const token = getToken();
  const opts = {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API+url, opts);
  if (res.status === 401) { logout(); return; }
  const json = await res.json();
  return json.data !== undefined ? json.data : json;
}

// ── Navigation ──────────────────────────────────────────────────
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick')?.includes(page)) el.classList.add('active');
  });
  const titles = {
    dashboard: ['لوحة التحكم','نظرة شاملة على النظام والاشتراكات'],
    analytics:  ['التحليلات المالية','الإيرادات · MRR · ARR · التوزيع'],
    tenants:    ['المستأجرون','إدارة جميع المستأجرين والاشتراكات'],
    plans:      ['إدارة الباقات','تسعير · مميزات · حدود الاستخدام'],
    invoices:   ['الفواتير','تتبع المدفوعات والفواتير المعلقة'],
    settings:   ['الإعدادات','إعدادات النظام العامة'],
  };
  const [t,s] = titles[page] || ['الصفحة',''];
  document.getElementById('page-title').textContent = t;
  document.getElementById('page-subtitle').textContent = s;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="flex justify-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i></div>';
  const pages = { dashboard:loadDashboard, analytics:loadAnalytics, tenants:loadTenants, plans:loadPlans, invoices:loadInvoices, settings:loadSettings };
  (pages[page] || loadDashboard)();
}

// ── DASHBOARD ───────────────────────────────────────────────────
async function loadDashboard() {
  let stats = {};
  try { stats = await apiFetch('/super-admin/stats') || {}; } catch(e) {}

  const t = stats.tenants || {};
  const r = stats.revenue || {};
  const s = stats.subs    || {};
  const plans = stats.plans || [];

  document.getElementById('content').innerHTML = `
  <div class="fade-in space-y-6">

    <!-- KPIs -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${kpiCard('MRR', formatSAR(r.mrr||0), 'chart-line', '#3b82f6', 'الإيراد الشهري المتكرر')}
      ${kpiCard('ARR', formatSAR(r.arr||0), 'chart-bar', '#059669', 'الإيراد السنوي المتكرر')}
      ${kpiCard('مستأجرون نشطون', t.active||0, 'building', '#7c3aed', 'من '+(t.total||0)+' إجمالي')}
      ${kpiCard('فواتير معلقة', r.pending_count||0, 'clock', '#d97706', formatSAR(r.pending_amount||0))}
    </div>

    <!-- Row 2 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

      <!-- توزيع الباقات -->
      <div class="card p-5">
        <h3 class="font-bold text-white mb-4"><i class="fas fa-layer-group text-blue-400 ml-2"></i>توزيع الباقات</h3>
        <canvas id="chart-plans" height="200"></canvas>
      </div>

      <!-- حالة الاشتراكات -->
      <div class="card p-5">
        <h3 class="font-bold text-white mb-4"><i class="fas fa-circle-check text-green-400 ml-2"></i>حالة الاشتراكات</h3>
        <div class="space-y-3 mt-6">
          ${statusRow('نشطة', s.active||0, '#3b82f6')}
          ${statusRow('تجريبية', s.trial||0, '#f59e0b')}
          ${statusRow('ملغاة', s.cancelled||0, '#ef4444')}
        </div>
        <div class="mt-4 grid grid-cols-3 gap-2 text-center">
          <div class="p-2 rounded-xl" style="background:#0c1a4010;"><div class="text-xl font-black text-blue-400">${s.active||0}</div><div class="text-xs text-slate-500">نشطة</div></div>
          <div class="p-2 rounded-xl" style="background:#42200610;"><div class="text-xl font-black text-yellow-400">${s.trial||0}</div><div class="text-xs text-slate-500">تجريبية</div></div>
          <div class="p-2 rounded-xl" style="background:#45090910;"><div class="text-xl font-black text-red-400">${s.cancelled||0}</div><div class="text-xs text-slate-500">ملغاة</div></div>
        </div>
      </div>

      <!-- إجراءات سريعة -->
      <div class="card p-5">
        <h3 class="font-bold text-white mb-4"><i class="fas fa-bolt text-yellow-400 ml-2"></i>إجراءات سريعة</h3>
        <div class="space-y-2">
          <button onclick="navigate('tenants')" class="btn btn-primary w-full justify-start"><i class="fas fa-building"></i>إدارة المستأجرين</button>
          <button onclick="navigate('plans')" class="btn btn-outline w-full justify-start"><i class="fas fa-layer-group"></i>تعديل الباقات والأسعار</button>
          <button onclick="navigate('invoices')" class="btn btn-outline w-full justify-start"><i class="fas fa-file-invoice-dollar"></i>الفواتير المعلقة</button>
          <button onclick="navigate('analytics')" class="btn btn-outline w-full justify-start"><i class="fas fa-chart-line"></i>تقرير الإيرادات</button>
        </div>
      </div>
    </div>

    <!-- جدول أحدث المستأجرين -->
    <div class="card p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-white"><i class="fas fa-users text-slate-400 ml-2"></i>أحدث المستأجرين</h3>
        <button onclick="navigate('tenants')" class="text-blue-400 text-sm hover:underline">عرض الكل</button>
      </div>
      <div id="recent-tenants-list">
        <div class="text-center py-4 text-slate-500 text-sm">جاري التحميل...</div>
      </div>
    </div>
  </div>`;

  // رسم مخطط الباقات
  setTimeout(() => {
    const ctx = document.getElementById('chart-plans');
    if (ctx && plans.length) {
      if (_charts.plans) _charts.plans.destroy();
      _charts.plans = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: plans.map(p => p.name_ar || p.name),
          datasets: [{
            data: plans.map(p => Number(p.subscriber_count||0)),
            backgroundColor: ['#3b82f6','#7c3aed','#059669','#d97706'],
            borderWidth: 2, borderColor: '#1e293b', hoverOffset: 6
          }]
        },
        options: {
          responsive: true, cutout: '60%',
          plugins: {
            legend: { position:'bottom', labels:{ color:'#94a3b8', boxWidth:12, font:{family:'Tajawal',size:11} } }
          }
        }
      });
    }
    loadRecentTenants();
  }, 100);
}

async function loadRecentTenants() {
  try {
    const res = await apiFetch('/super-admin/tenants?limit=5');
    const tenants = res.data || res || [];
    const el = document.getElementById('recent-tenants-list');
    if (!el) return;
    if (!tenants.length) { el.innerHTML='<div class="text-center py-4 text-slate-500 text-sm">لا توجد بيانات</div>'; return; }
    el.innerHTML = `<table class="w-full text-sm">
      <thead><tr class="border-b border-slate-700">
        <th class="text-right py-2 px-3 text-slate-400 font-medium">المستأجر</th>
        <th class="text-right py-2 px-3 text-slate-400 font-medium">الباقة</th>
        <th class="text-right py-2 px-3 text-slate-400 font-medium">الحالة</th>
        <th class="text-right py-2 px-3 text-slate-400 font-medium">المستخدمون</th>
        <th class="py-2 px-3"></th>
      </tr></thead>
      <tbody>
        ${tenants.map(t => `
        <tr class="table-row border-b border-slate-800 cursor-pointer" onclick="openTenantModal('${t.id}')">
          <td class="py-3 px-3"><div class="font-semibold text-white">${t.name||''}</div><div class="text-xs text-slate-500">${t.email||''}</div></td>
          <td class="py-3 px-3"><span class="badge-blue">${t.plan_name||'—'}</span></td>
          <td class="py-3 px-3">${statusBadge(t.status)}</td>
          <td class="py-3 px-3 text-slate-300">${t.active_users||0}</td>
          <td class="py-3 px-3"><button onclick="event.stopPropagation();openAssignModal('${t.id}')" class="text-blue-400 hover:text-blue-300 text-xs"><i class="fas fa-exchange-alt"></i></button></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  } catch(e) {}
}

// ── ANALYTICS ───────────────────────────────────────────────────
async function loadAnalytics() {
  let data = {};
  try { data = await apiFetch('/super-admin/revenue') || {}; } catch(e) {}

  const monthly = data.monthly || [];
  const byPlan  = data.byPlan  || [];
  const byStatus= data.byStatus|| [];

  document.getElementById('content').innerHTML = `
  <div class="fade-in space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="card p-5">
        <h3 class="font-bold text-white mb-4"><i class="fas fa-chart-line text-blue-400 ml-2"></i>الإيرادات — آخر 12 شهراً</h3>
        <canvas id="chart-revenue" height="200"></canvas>
      </div>
      <div class="card p-5">
        <h3 class="font-bold text-white mb-4"><i class="fas fa-chart-pie text-purple-400 ml-2"></i>توزيع الإيرادات حسب الباقة</h3>
        <canvas id="chart-plan-revenue" height="200"></canvas>
      </div>
    </div>

    <div class="card p-5">
      <h3 class="font-bold text-white mb-4"><i class="fas fa-table text-green-400 ml-2"></i>الإيرادات حسب الباقة</h3>
      <table class="w-full text-sm">
        <thead><tr class="border-b border-slate-700">
          <th class="text-right py-2 px-3 text-slate-400">الباقة</th>
          <th class="text-right py-2 px-3 text-slate-400">المشتركون</th>
          <th class="text-right py-2 px-3 text-slate-400">MRR</th>
        </tr></thead>
        <tbody>
          ${byPlan.map(p=>`<tr class="border-b border-slate-800">
            <td class="py-3 px-3 text-white font-medium">${p.name_ar||p.name}</td>
            <td class="py-3 px-3 text-slate-300">${p.subscribers||0}</td>
            <td class="py-3 px-3 text-green-400 font-bold">${formatSAR(p.mrr||0)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  setTimeout(() => {
    if (monthly.length) {
      const ctx = document.getElementById('chart-revenue');
      if (ctx) {
        if (_charts.revenue) _charts.revenue.destroy();
        _charts.revenue = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: monthly.map(m => m.month),
            datasets: [{
              label: 'الإيرادات (ريال)',
              data: monthly.map(m => Number(m.revenue||0)),
              backgroundColor: '#3b82f680', borderColor: '#3b82f6', borderWidth: 2, borderRadius: 6
            }]
          },
          options: {
            responsive:true,
            plugins: { legend: { labels: { color:'#94a3b8', font:{family:'Tajawal'} } } },
            scales: {
              x: { ticks:{ color:'#64748b', font:{family:'Tajawal'} }, grid:{ color:'#1e293b' } },
              y: { ticks:{ color:'#64748b', font:{family:'Tajawal'}, callback: v => formatSAR(v) }, grid:{ color:'#1e293b' } }
            }
          }
        });
      }
    }
    if (byPlan.length) {
      const ctx2 = document.getElementById('chart-plan-revenue');
      if (ctx2) {
        if (_charts.planRevenue) _charts.planRevenue.destroy();
        _charts.planRevenue = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: byPlan.map(p=>p.name_ar||p.name),
            datasets: [{ data: byPlan.map(p=>Number(p.mrr||0)), backgroundColor:['#3b82f6','#7c3aed','#059669','#d97706'], borderColor:'#1e293b', borderWidth:2, hoverOffset:6 }]
          },
          options: { responsive:true, cutout:'60%', plugins:{ legend:{ position:'bottom', labels:{color:'#94a3b8',boxWidth:12,font:{family:'Tajawal',size:11}} } } }
        });
      }
    }
  }, 100);
}

      price_monthly: parseFloat(document.getElementById('np-monthly').value)||0,
      price_yearly:  parseFloat(document.getElementById('np-yearly').value)||0,
      max_users:     parseInt(document.getElementById('np-users').value)||5,
      max_projects:  parseInt(document.getElementById('np-projects').value)||2,
      storage_gb:    parseInt(document.getElementById('np-storage').value)||5,
    });
    closeModal('modal-plan');
    showToast('✅ تم إنشاء الباقة');
    loadPlans();
  } catch(e) { showToast('❌ خطأ في الإنشاء', 'error'); }
}

async function toggleFeature(planId, feature, enabled) {
  try {
    await apiFetch('/super-admin/plans/'+planId+'/features', 'PUT', { feature, enabled });
    showToast((enabled?'✅ تم تفعيل':'🔴 تم تعطيل')+' '+feature);
    const idx = _plans.findIndex(p=>p.id===planId);
    if (idx>=0) {
      const feats = typeof _plans[idx].features==='string'?JSON.parse(_plans[idx].features):(_plans[idx].features||{});
      feats[feature] = enabled;
      _plans[idx].features = feats;
    }
  } catch(e) { showToast('❌ خطأ في التحديث', 'error'); }
}

async function payInvoice(id) {
  if (!confirm('تأكيد تسجيل الدفع لهذه الفاتورة؟')) return;
  try {
    await apiFetch('/super-admin/invoices/'+id+'/pay', 'POST');
    showToast('✅ تم تسجيل الدفع');
    loadInvoices();
  } catch(e) { showToast('❌ خطأ', 'error'); }
}

function printInvoice(id) { showToast('⬇️ جاري تحضير الفاتورة...'); }

// ── HELPERS ───────────────────────────────────────────────────────
function formatSAR(v) { return Number(v||0).toLocaleString('ar-SA')+' ريال'; }

function statusBadge(s) {
  const map = { ACTIVE:'badge-green', TRIAL:'badge-yellow', CANCELLED:'badge-red', EXPIRED:'badge-red', PAST_DUE:'badge-yellow' };
  const ar  = { ACTIVE:'نشط', TRIAL:'تجريبي', CANCELLED:'ملغى', EXPIRED:'منتهي', PAST_DUE:'متأخر' };
  return `<span class="${map[s]||'badge-gray'}">${ar[s]||s||'—'}</span>`;
}

function invStatusBadge(s) {
  const map = { paid:'badge-green', pending:'badge-yellow', failed:'badge-red', refunded:'badge-blue' };
  const ar  = { paid:'مدفوعة', pending:'معلقة', failed:'فاشلة', refunded:'مسترجعة' };
  return `<span class="${map[s]||'badge-gray'}">${ar[s]||s||'—'}</span>`;
}

function kpiCard(label, value, icon, color, sub) {
  return `<div class="stat-card">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-xs text-slate-500 mb-1">${label}</p>
        <p class="text-2xl font-black" style="color:${color}">${value}</p>
        <p class="text-xs text-slate-600 mt-1">${sub}</p>
      </div>
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${color}20">
        <i class="fas fa-${icon} text-lg" style="color:${color}"></i>
      </div>
    </div>
  </div>`;
}

function statusRow(label, count, color) {
  return `<div class="flex items-center justify-between">
    <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:${color}"></div><span class="text-sm text-slate-300">${label}</span></div>
    <span class="font-bold" style="color:${color}">${count}</span>
  </div>`;
}

function openModal(id) { document.getElementById(id)?.classList.add('open'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }

function showToast(msg, type='success') {
  const d = document.createElement('div');
  const c = type==='error' ? '#dc2626' : '#059669';
  d.style.cssText=`position:fixed;bottom:24px;right:24px;z-index:9999;padding:11px 20px;border-radius:10px;background:${c};color:white;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);font-family:Tajawal,sans-serif;`;
  d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),3500);
}

// ── Clock ─────────────────────────────────────────────────────────
function updateClock() {
  const el = document.getElementById('current-time');
  if (el) el.textContent = new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ── Init ──────────────────────────────────────────────────────────
(async function() {
  const token = getToken();
  if (!token) { location.href = '/'; return; }
  navigate('dashboard');
})();
</script>
