<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mizan">
  <!-- Mizan mark: a balance beam (measurement) resting over an approval check (conformance) -->
  <defs>
    <linearGradient id="mz-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a37a"/>
      <stop offset="1" stop-color="#0b6b4f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#mz-g)"/>
  <!-- beam -->
  <path d="M15 21.5h34" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
  <!-- pivot -->
  <circle cx="32" cy="21.5" r="4.2" fill="#f3c74f"/>
  <!-- check -->
  <path d="M19.5 37.5l8.6 8.4L45 29.2" fill="none" stroke="#fff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
