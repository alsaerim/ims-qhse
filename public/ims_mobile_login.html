<!DOCTYPE html>
<html lang="ar" dir="rtl" data-surface="auth">
<head>
<script src="/assets/isoradar-api.js"></script>
<script>/* ISO Radar i18n: load the English dictionary only when English is selected */
(function () {
  var q = location.search, en = false;
  try { en = /[?&]lang=en(&|$)/.test(q) || (!/[?&]lang=ar(&|$)/.test(q) && localStorage.getItem('ir_lang') === 'en'); } catch (e) {}
  if (en) document.write('<scr' + 'ipt src="/assets/i18n/en.js"></scr' + 'ipt>');
})();
</script>
<script src="/assets/isoradar-i18n.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="آيزو رادار"/>
<meta name="theme-color" content="#125f57"/>
<title>آيزو رادار — دخول التطبيق</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);}

body{
  min-height:100dvh;
  background:linear-gradient(160deg,#0d1f37 0%,#0f4c46 55%,#312e81 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
  overflow-x:hidden;
}

/* ── Background pattern ── */
body::before{
  content:'';position:fixed;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%233b82f6' fill-opacity='0.04'%3E%3Ccircle cx='20' cy='20' r='2'/%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
}

/* ── Card ── */
.card{
  width:100%;max-width:380px;
  background:rgba(255,255,255,.96);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.4);
  position:relative;z-index:1;
}

/* ── Header ── */
.card-header{
  background:linear-gradient(135deg,#125f57,#4f46e5);
  padding:32px 28px 28px;
  text-align:center;
  position:relative;overflow:hidden;
}
.card-header::before{
  content:'';position:absolute;top:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.card-header::after{
  content:'';position:absolute;bottom:-20px;right:-20px;
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.app-icon{
  width:72px;height:72px;border-radius:22px;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;position:relative;z-index:1;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.app-icon i{font-size:30px;color:white;}
.card-header h1{font-size:22px;font-weight:900;color:white;margin-bottom:4px;position:relative;z-index:1;}
.card-header p{font-size:12px;color:rgba(255,255,255,.65);position:relative;z-index:1;}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.15);border-radius:12px;padding:4px;margin-top:18px;position:relative;z-index:1;}
.tab-btn{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.65);transition:all .2s;font-family:'Tajawal',sans-serif;}
.tab-btn.active{background:white;color:#125f57;}

/* ── Body ── */
.card-body{padding:24px 24px 28px;}

/* ── Form ── */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:#4f5f75;margin-bottom:5px;}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#5d6b7e;font-size:14px;pointer-events:none;}
.form-input{
  width:100%;padding:12px 38px 12px 14px;
  border:1.5px solid #e3e8ef;border-radius:12px;
  font-size:14px;font-family:'Tajawal',sans-serif;
  transition:all .2s;outline:none;background:white;
  color:#142D4E;
}
.form-input:focus{border-color:#22A699;box-shadow:0 0 0 3px rgba(34,166,153,.12);}

/* ── Button ── */
.btn-login{
  width:100%;padding:14px;margin-top:4px;
  background:linear-gradient(135deg,#125f57,#4f46e5);
  color:white;border:none;border-radius:14px;
  font-size:15px;font-weight:800;cursor:pointer;
  font-family:'Tajawal',sans-serif;
  transition:all .2s;
  box-shadow:0 6px 20px rgba(20,45,78,.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:active{transform:scale(.97);}

/* ── Error/Success ── */
.alert{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none;font-weight:600;}
.alert-error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.alert-success{background:#f0fdf4;color:#047857;border:1px solid #bbf7d0;}

/* ── Register fields ── */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.role-chip{
  padding:10px 8px;border-radius:10px;border:1.5px solid #e3e8ef;
  text-align:center;cursor:pointer;transition:all .15s;
  font-size:12px;font-weight:600;color:#5d6b7e;
}
.role-chip.selected{border-color:#125f57;background:#f1faf8;color:#125f57;}
.role-chip i{display:block;font-size:18px;margin-bottom:4px;}

/* ── Footer ── */
.page-footer{
  margin-top:20px;text-align:center;
  font-size:11px;color:rgba(255,255,255,.6);
  position:relative;z-index:1;
}
.page-footer a{color:rgba(255,255,255,.78);font-weight:600;}

/* ── Loading spinner ── */
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.card{animation:fadeUp .4s ease;}

/* ── Polish: browser surfaces ── */
::selection{background:#bfe8e1;color:#142D4E;}
:focus-visible{outline:2px solid #22A699;outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"/>
<link rel="icon" type="image/svg+xml" href="/assets/isoradar-mark.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"/>
<link rel="stylesheet" href="/assets/isoradar.css"/>
</head>
<body>

<div style="position:fixed;top:14px;inset-inline-end:14px;z-index:5"><button type="button" class="ir-lang on-dark" data-lang-toggle data-no-i18n aria-label="Language / اللغة"><i class="fas fa-globe"></i><span class="ir-l-en">English</span><span class="ir-l-ar">العربية</span></button></div>
<div class="card">
  <!-- Header -->
  <div class="card-header">
    <div class="app-icon"><img src="/assets/isoradar-mark.svg" alt="" class="mz-mark" width="72" height="72" style="width:72px;height:72px"/></div>
    <h1>آيزو رادار</h1>
    <p>تطبيق الميدان · Field Inspection App</p>
    <div class="tabs">
      <button class="tab-btn active" id="tab-login"    onclick="switchTab('login')">دخول الأعضاء</button>
      <button class="tab-btn"         id="tab-register" onclick="switchTab('register')">انضم للفريق</button>
    </div>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- ── LOGIN ── -->
    <div id="form-login">
      <div class="alert alert-error" id="err-login"></div>

      <div class="form-group">
        <label for="login-email">البريد الإلكتروني أو اسم المستخدم</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-input" type="email" id="login-email" placeholder="engineer@company.com"
            inputmode="email" autocomplete="email"/>
        </div>
      </div>

      <div class="form-group">
        <label for="login-pass">كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock" id="pass-icon" style="cursor:pointer;" onclick="togglePass()" role="button" tabindex="0" aria-label="إظهار كلمة المرور" aria-pressed="false" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePass()}"></i>
          <input class="form-input" type="password" id="login-pass" placeholder="••••••••"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doMobileLogin()"/>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#5d6b7e;">
          <input type="checkbox" id="remember-me" style="width:14px;height:14px;accent-color:#125f57;"/>
          تذكرني
        </label>
        <a href="mailto:support@isoradar.com?subject=%D8%A7%D8%B3%D8%AA%D8%B9%D8%A7%D8%AF%D8%A9%20%D9%83%D9%84%D9%85%D8%A9%20%D8%A7%D9%84%D9%85%D8%B1%D9%88%D8%B1" style="font-size:12px;color:#17796f;font-weight:600;">نسيت كلمة المرور؟</a>
      </div>

      <button class="btn-login" id="login-btn" onclick="doMobileLogin()">
        <i class="fas fa-sign-in-alt"></i>
        <span>دخول</span>
      </button>

      </div>
    </div>

    <!-- ── REGISTER ── -->
    <div id="form-register" style="display:none;">
      <div class="alert alert-error"   id="err-register"></div>
      <div class="alert alert-success" id="suc-register"></div>

      <div class="form-group">
        <label for="reg-name">الاسم الكامل</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input class="form-input" type="text" id="reg-name" placeholder="محمد الزهراني"/>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-input" type="email" id="reg-email" placeholder="mohammed@company.com" inputmode="email"/>
        </div>
      </div>

      <div class="form-group">
        <label>الدور الوظيفي</label>
        <div class="role-grid" id="role-grid" role="radiogroup" aria-label="الدور الوظيفي">
          <div class="role-chip selected" data-role="engineer" onclick="selectRole(this)" role="radio" aria-checked="true" tabindex="0"><i class="fas fa-hard-hat"></i>مهندس</div>
          <div class="role-chip" data-role="auditor"  onclick="selectRole(this)" role="radio" aria-checked="false" tabindex="-1"><i class="fas fa-search"></i>مدقق</div>
          <div class="role-chip" data-role="manager"  onclick="selectRole(this)" role="radio" aria-checked="false" tabindex="-1"><i class="fas fa-user-tie"></i>مدير</div>
          <div class="role-chip" data-role="inspector" onclick="selectRole(this)" role="radio" aria-checked="false" tabindex="-1"><i class="fas fa-clipboard-check"></i>مفتش</div>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-code">رمز الشركة</label>
        <div class="input-wrap">
          <i class="fas fa-building"></i>
          <input class="form-input" type="text" id="reg-code" placeholder="IMS-2026-XXX (احصل عليه من مدير النظام)"/>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-pass">كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-input" type="password" id="reg-pass" placeholder="8 أحرف على الأقل"/>
        </div>
      </div>

      <button class="btn-login" id="reg-btn" onclick="doMobileRegister()" style="background:linear-gradient(135deg,#065f46,#047857);">
        <i class="fas fa-user-plus"></i>
        <span>انضم للفريق</span>
      </button>
    </div>

  </div>
</div>

<!-- Footer -->
<div class="page-footer">
  <div style="margin-bottom:6px;">
    <a href="ims_landing.html">الصفحة الرئيسية</a> ·
    <a href="mailto:support@isoradar.com">الدعم الفني</a> ·
    <a href="/privacy">الخصوصية</a>
  </div>
  <div>© 2026 آيزو رادار · نسخة الجوال 2.4.1</div>
</div>

<script>
// ── Tab switch ──
function switchTab(tab) {
  document.getElementById('form-login').style.display    = tab==='login'    ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab==='register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
}

// ── Role select ──
function selectRole(el) {
  document.querySelectorAll('.role-chip').forEach(c => { c.classList.remove('selected'); c.setAttribute('aria-checked', 'false'); c.tabIndex = -1; });
  el.classList.add('selected');
  el.setAttribute('aria-checked', 'true');
  el.tabIndex = 0;
}
// role chips behave as a radio group: arrows move the choice, Enter/Space picks
document.addEventListener('keydown', e => {
  const chip = e.target.closest && e.target.closest('.role-chip');
  if (!chip) return;
  const chips = [...document.querySelectorAll('.role-chip')], i = chips.indexOf(chip);
  let next = null;
  if (e.key === 'Enter' || e.key === ' ') next = chip;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') next = chips[(i + 1) % chips.length];
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') next = chips[(i - 1 + chips.length) % chips.length];
  if (!next) return;
  e.preventDefault();
  selectRole(next);
  next.focus();
});

// ── Toggle password ──
let passVisible = false;
function togglePass() {
  passVisible = !passVisible;
  const inp  = document.getElementById('login-pass');
  const icon = document.getElementById('pass-icon');
  inp.type   = passVisible ? 'text' : 'password';
  icon.className = passVisible ? 'fas fa-eye-slash' : 'fas fa-lock';
  icon.setAttribute('aria-pressed', String(passVisible));
  icon.setAttribute('aria-label', passVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
}

const API = window.IR_API_ORIGIN + '/api/v1';

// ── Login ──
function doMobileLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('err-login');
  const btn   = document.getElementById('login-btn');

  if (!email || !pass) { showAlert(err,'يرجى تعبئة جميع الحقول'); return; }

  err.style.display = 'none';
  btn.innerHTML = '<div class="spinner"></div><span>جاري التحقق...</span>';
  btn.disabled  = true;

  fetch(API + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pass })
  })
  .then(r => r.json())
  .then(res => {
    const d = res.data || res;
    if (d.access_token) {
      localStorage.setItem('ims_token', d.access_token);
      if (d.refresh_token) localStorage.setItem('ims_refresh_token', d.refresh_token);
      if (d.user) localStorage.setItem('ims_user', JSON.stringify(d.user));
      btn.innerHTML = '<i class="fas fa-check-circle"></i><span>تم الدخول!</span>';
      btn.style.background = 'linear-gradient(135deg,#065f46,#047857)';
      setTimeout(() => { window.location.href = '/mobile'; }, 700);
    } else {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول</span>';
      showAlert(err, d.message || res.message || 'بيانات الدخول غير صحيحة');
    }
  })
  .catch(() => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول</span>';
    showAlert(err, 'خطأ في الاتصال بالخادم');
  });
}

// ── Register ──
function doMobileRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const code  = document.getElementById('reg-code').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const role  = document.querySelector('.role-chip.selected')?.dataset?.role || 'engineer';
  const err   = document.getElementById('err-register');
  const suc   = document.getElementById('suc-register');
  const btn   = document.getElementById('reg-btn');

  if (!name || !email || !pass) { showAlert(err,'يرجى تعبئة الحقول المطلوبة'); return; }
  if (pass.length < 8) { showAlert(err,'كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }

  err.style.display = 'none';
  btn.innerHTML = '<div class="spinner"></div><span>جاري الإنشاء...</span>';
  btn.disabled  = true;

  setTimeout(() => {
    btn.disabled  = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i><span>انضم للفريق</span>';
    suc.style.display = 'block';
    suc.textContent   = `✅ تم إنشاء حسابك يا ${name.split(' ')[0]}! في انتظار موافقة المدير.`;
    document.getElementById('reg-name').value  = '';
    document.getElementById('reg-email').value = '';
    document.getElementById('reg-pass').value  = '';
    document.getElementById('reg-code').value  = '';
  }, 1400);
}

function showAlert(el, msg) {
  el.textContent   = msg;
  el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ── Auto-restore session ──
if (localStorage.getItem('ims_token') && localStorage.getItem('ims_mobile_user')) {
  window.location.href = 'ims_mobile.html';
}
</script>
</body>
</html>
